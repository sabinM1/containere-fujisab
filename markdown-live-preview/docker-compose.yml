services:

  # ─────────────────────────────────────────────────────────────
  # MARKDOWN LIVE PREVIEW — static site server
  # ─────────────────────────────────────────────────────────────
  md-live-preview:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/md-live-preview:latest
    labels:
      wud.watch.digest: "true"
    container_name: md-live-preview
    restart: always

    # ── #3: container hardening ──────────────────────────────────
    user: "101:101"                 # nginx user in the alpine image
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /var/log/nginx:mode=1777
      - /tmp:mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE            # allow non-root to bind :80
    security_opt:
      - no-new-privileges:true

    # Skip /docker-entrypoint.sh — it tries to write to /etc/nginx,
    # which fails under read_only. Our mounted config replaces it.
    entrypoint: ["nginx", "-g", "daemon off;"]
    command: []

    # ── #4: resource limits ──────────────────────────────────────
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 100

    environment:
      TZ: "${TZ}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro   # #5
    expose:
      - "80"
    networks:
      - md_live_preview_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # ANUBIS — PoW challenge layer
  # ─────────────────────────────────────────────────────────────
  init-anubis:
    image: alpine:latest
    labels:
      wud.watch.digest: "true"
    container_name: init-anubis-md
    command:
      - /bin/sh
      - -c
      - |
        cat > /config/policies.yaml <<'POLICY'
        {
          "bots": [
            {"name": "well-known", "path_regex": "^/.well-known/.*$", "action": "ALLOW"},
            {"name": "favicon",   "path_regex": "^/favicon\\.ico$", "action": "ALLOW"},
            {"name": "robots",    "path_regex": "^/robots\\.txt$",   "action": "ALLOW"},
            {"name": "static",    "path_regex": "^/static/.*$",      "action": "ALLOW"},
            {"name": "assets",    "path_regex": "^/assets/.*$",      "action": "ALLOW"},
            {"name": "generic-browser", "user_agent_regex": "Mozilla", "action": "CHALLENGE"}
          ]
        }
        POLICY
        chmod 644 /config/policies.yaml
    # ── #4: minimal limits for the one-shot init ─────────────────
    mem_limit: 32m
    pids_limit: 20
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - anubis-config-md:/config
    networks:
      - md_live_preview_net

  anubis:
    image: ghcr.io/techarohq/anubis:latest
    labels:
      wud.watch.digest: "true"
    container_name: anubis-md
    restart: always
    depends_on:
      init-anubis:
        condition: service_completed_successfully
      md-live-preview:
        condition: service_started

    # ── #4: hardening + limits ───────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 200

    volumes:
      - anubis-config-md:/config:ro
      - anubis-data-md:/data
    environment:
      BIND: ":8923"
      TARGET: "http://md-live-preview:80"
      DIFFICULTY: "3"
      SECRET_KEY: "${ANUBIS_SECRET_KEY}"
      CUSTOM_REAL_IP_HEADER: "CF-Connecting-IP"
      TRUSTED_PROXIES: "172.28.0.0/16"
      COOKIE_SECURE: "true"
      COOKIE_HTTP_ONLY: "true"
      COOKIE_SAME_SITE: "Lax"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN}"
      COOKIE_EXPIRY: "12h"
      POLICY_FNAME: "/config/policies.yaml"
      STORAGE_TYPE: "bbolt"
      STORAGE_BBOLT_PATH: "/data/anubis.db"
      REDIRECT_DOMAINS: "${PUBLIC_DOMAIN}"
    ports:
      - "127.0.0.1:8083:8923"
    networks:
      - md_live_preview_net

  # ─────────────────────────────────────────────────────────────
  # CLOUDFLARED — Cloudflare Tunnel
  # ─────────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    labels:
      wud.watch.digest: "true"
    container_name: cloudflared-md
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - anubis

    # ── #4: hardening + limits ───────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /home/nonroot:mode=1777
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 100

    networks:
      - md_live_preview_net

volumes:
  anubis-config-md:
  anubis-data-md:

networks:
  md_live_preview_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
